<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- background mimicking a photo with text overlay -->
  <rect width="80" height="80" rx="6" fill="#8B9DAF"/>
  <!-- fake photo: mountain/landscape shapes -->
  <polygon points="0,60 20,35 40,55 55,38 80,58 80,80 0,80" fill="#6B7D8F" opacity="0.6"/>
  <polygon points="0,65 30,45 50,60 80,50 80,80 0,80" fill="#5A6B7A" opacity="0.5"/>
  <!-- sun/circle -->
  <circle cx="60" cy="22" r="8" fill="#FFD93D" opacity="0.7"/>
  <!-- text overlay on the photo -->
  <rect x="8" y="42" width="64" height="22" rx="3" fill="black" opacity="0.45"/>
  <rect x="14" y="48" width="42" height="3" rx="1" fill="white" opacity="0.9"/>
  <rect x="14" y="54" width="34" height="2.5" rx="1" fill="white" opacity="0.6"/>
  <!-- upload hint icon at top-right -->
  <circle cx="66" cy="14" r="8" fill="white" opacity="0.85"/>
  <path d="M66 10 L66 18" stroke="#8B9DAF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M62 14 L66 10 L70 14" stroke="#8B9DAF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- slide indicator dots -->
  <circle cx="34" cy="73" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="40" cy="73" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="46" cy="73" r="1.5" fill="white" opacity="0.4"/>
</svg>